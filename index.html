<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <h1>FIN-SHOP</h1>
            <p>Jelajahi berbagai product dari FIN-SHOP</p>
        </div>
    </header>

    <main class="container">
        <section class="controls">
            <div class="control-group search-group">
                <label for="searchInput">Cari Product</label>
                <input type="text" id="searchInput" placeholder="Cari nama product...">
            </div>

            <div class="control-group">
                <label for="categorySelect">Category</label>
                <select id="categorySelect">
                    <option value="all">Semua kategori</option>
                </select>
            </div>

            <div class="control-group">
                <label for="sortSelect">Sorting</label>
                <select id="sortSelect">
                    <option value="default">Default</option>
                    <option value="price-low">Harga Terendah</option>
                    <option value="price-high">Harga Tertinggi</option>
                    <option value="rating-high">Rating Tertinggi</option>
                    <option value="name-az">Nama A - Z</option>
                </select>
            </div>

            <button id="resetButton" class="reset-button">Reset Filter</button>
        </section>

        <div class="result-info">
            <p id="productCounter">Memuat product...</p>
        </div>

        <div id="loading" class="message">
            <p>Loading product...</p>
        </div>

        <div id="error" class="message error-message hidden">
            <p>Gagal mengambil data product. Silakan coba lagi.</p>
            <button id="retryButton">Coba Lagi</button>
        </div>

        <section id="productGrid" class="product-grid"></section>
    </main>

    <div id="detailModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeModal" class="close-button">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
